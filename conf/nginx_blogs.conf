# Catch-all for blogs served on subdomains of __DOMAIN__ (e.g. myblog.__DOMAIN__).
# Bear Blog resolves blogs from the Host header, and YunoHost's default 443
# server only answers exact server_names, so these hostnames need their own
# block. Subdomains later added to YunoHost as proper domains have exact
# server_name blocks which nginx matches in preference to this wildcard.
# TLS uses the main domain's certificate: browsers warn unless it covers
# *.__DOMAIN__ (add a wildcard cert, see doc/ADMIN.md).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.__DOMAIN__;

    include /etc/nginx/conf.d/security.conf.inc;
    ssl_certificate /etc/yunohost/certs/__DOMAIN__/crt.pem;
    ssl_certificate_key /etc/yunohost/certs/__DOMAIN__/key.pem;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    access_log /var/log/nginx/__DOMAIN__-access.log;
    error_log /var/log/nginx/__DOMAIN__-error.log;
}
