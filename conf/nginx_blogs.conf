# Catch-all for blogs on subdomains of __DOMAIN__: Bear Blog resolves blogs
# from the Host header, but YunoHost's 443 servers only match exact names.
# TLS reuses the main cert: needs wildcard coverage, see doc/ADMIN.md.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.__DOMAIN__;

    include /etc/nginx/conf.d/security.conf.inc;
    ssl_certificate /etc/yunohost/certs/__DOMAIN__/crt.pem;
    ssl_certificate_key /etc/yunohost/certs/__DOMAIN__/key.pem;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    access_log /var/log/nginx/__DOMAIN__-access.log;
    error_log /var/log/nginx/__DOMAIN__-error.log;
}
